<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Картка — практична CSS</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>

  <!--
    Варіант контенту визначається викладачем.
    Структура (теги, класи) однакова для всіх варіантів —
    змінюється тільки контент усередині.

    Варіант A — Картка ТОВАРУ
    Варіант B — Картка ПРОФІЛЮ
    Варіант C — Картка СТАТТІ
    Варіант D — Картка КУРСУ
  -->
<div style="display: flex; justify-content: center; width: 100%; height: 100%">
  <article class="card">
    <img class="card-image"
         src="https://m.media-amazon.com/images/M/MV5BMTM1NjExNjg1OV5BMl5BanBnXkFtZTcwMTQ0NzIwMw@@._V1_FMjpg_UX1000_.jpg"
         alt="Зображення Майкла Джексона">

    <h3 class="card-title">Майкл Джексон</h3>

    <p class="card-meta">
      Допоміжна інформація: автор, дата, тривалість тощо
    </p>

    <p class="card-description">
      Короткий опис: 1–2 речення, які пояснюють, про що ця картка
      та чому вона має зацікавити користувача.
    </p>

    <p class="card-price">499 грн</p>

    <button class="card-action" type="button">
      Дізнатися більше
    </button>
    <button style="border-color: deeppink">
      дізнатися ще більше
    </button>
    <button style="border-color: aqua">
      дізнатися нічого
    </button>
  </article>
</div>
</body>
</html>
